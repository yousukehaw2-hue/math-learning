<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国語まなび</title><style>
:root{font-family:system-ui,sans-serif;color:#26354b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:18px}header{background:#325d85;color:white;padding:18px;border-radius:18px}h1{margin:0;font-size:1.6rem}.panel{background:white;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 2px 9px #0001}button,select,textarea{font:inherit}button{padding:12px 16px;border:0;border-radius:12px;background:#325d85;color:white;cursor:pointer;margin:5px 4px 5px 0}button:disabled{opacity:.45}button.alt{background:#e4edf6;color:#26354b}textarea{width:100%;min-height:110px;border:1px solid #b6c6d5;border-radius:10px;padding:12px}canvas{width:100%;height:240px;border:2px solid #b6c6d5;border-radius:10px;touch-action:none;background:white}label{display:block;margin:8px 0}small{color:#59677b}.hidden{display:none}.option{display:block;width:100%;text-align:left;background:#edf3f8;color:#26354b} .option.selected{outline:3px solid #325d85}@media(min-width:700px){main{padding:30px}}
</style></head><body><main><header><h1>📖 国語まなび</h1><div>中学1年生・読解／漢字／文法／記述</div></header>
<section class="panel"><label>学習分野 <select id="category"><option value="all">すべて</option><option value="reading">読解</option><option value="kanji">漢字・語彙</option><option value="grammar">文法</option><option value="writing">記述</option></select></label><label>学習レベル <select id="level"><option value="all">すべて</option><option value="1">知識理解</option><option value="2">基本</option><option value="3">応用</option></select></label><button id="start">5問の学習を開始</button><p id="stats"></p></section>
<section id="quiz" class="panel hidden"><small id="progress"></small><h2 id="question"></h2><p id="passage"></p><div id="options"></div><div id="writing" class="hidden"><label>入力方法 <select id="mode"><option value="typing">キーボード</option><option value="handwriting">手書き</option></select></label><div id="typing"><textarea id="answer" placeholder="ここに答えを書こう"></textarea><small id="count"></small></div><div id="handwriting" class="hidden"><canvas id="ink" width="800" height="400" aria-label="手書き解答欄"></canvas><button class="alt" id="clear">書き直す</button><small>手書きはこの端末内の画面で確認します。文字認識は未実装です。</small></div></div><button id="check">答えを確認</button><div id="feedback" class="hidden" aria-live="polite"></div><button id="next" class="hidden">次の問題</button></section>
<section class="panel"><h2>学習について</h2><p>東京書籍の学習領域を想定した独自作成の試作問題です。教科書本文は転載していません。正式な単元・学年対応は教材監修後に追加します。</p><p>記述問題は自己評価方式です。自動採点や手書きOCRには対応していません。学習履歴はこの端末のブラウザにのみ保存します。</p></section></main><script>
const questions=[
{id:1,cat:'reading',level:1,type:'choice',passage:'雨が上がると、校庭の水たまりに青空が映った。',q:'水たまりに映ったものは何ですか。',choices:['青空','校舎','夕日'],correct:0,why:'「水たまりに青空が映った」が根拠です。'},
{id:2,cat:'reading',level:2,type:'choice',passage:'美咲は発表前に何度も原稿を読み返した。名前を呼ばれると深呼吸して立ち上がった。',q:'美咲の行動から読み取れる気持ちは？',choices:['緊張している','怒っている','退屈している'],correct:0,why:'「何度も読み返した」「深呼吸」が手がかりです。'},
{id:3,cat:'kanji',level:1,type:'choice',q:'「慎重」の読みは？',choices:['しんちょう','しんじゅう','しんしょう'],correct:0,why:'慎重（しんちょう）は注意深く行うことです。'},
{id:4,cat:'grammar',level:2,type:'choice',q:'「静かな町」の「静かな」の働きは？',choices:['町を修飾する','主語になる','接続する'],correct:0,why:'「静かな」は名詞「町」の様子を詳しくしています。'},
{id:5,cat:'writing',level:2,type:'writing',passage:'朝、雲が厚く広がっていた。陽菜は傘をかばんに入れて家を出た。',q:'陽菜が傘を持った理由を30字以内で説明しましょう。',limit:30,model:'雨が降りそうな空模様だったから。',rubric:['雨が降りそうだと判断したこと','空の雲を根拠にしていること','30字以内であること']},
{id:6,cat:'reading',level:3,type:'choice',passage:'試合には負けた。しかし、健太は仲間と顔を見合わせ、笑った。全員が最後まで走り切ったからだ。',q:'健太が笑った理由として最も適切なのは？',choices:['努力をやり切った達成感があった','勝利したから','試合を忘れたから'],correct:0,why:'「全員が最後まで走り切った」が理由です。'},
{id:7,cat:'writing',level:3,type:'writing',passage:'図書室の利用者は増えたが、返却が遅れる本も増えた。',q:'利用者に向けた改善案を、理由も含めて80字以内で書きましょう。',limit:80,model:'返却日を知らせる掲示を増やすとよい。返却日を忘れる人が減り、次に借りたい人も利用しやすくなるからだ。',rubric:['具体的な改善策がある','改善する理由が書かれている','80字以内である']},
{id:8,cat:'grammar',level:1,type:'choice',q:'「私は本を読む。」の主語は？',choices:['私は','本を','読む'],correct:0,why:'「だれが」に当たる「私は」が主語です。'},
{id:9,cat:'kanji',level:2,type:'choice',q:'「適切」の意味として最も近いものは？',choices:['状況によく合っている','急いでいる','珍しい'],correct:0,why:'適切とは、その場にふさわしいことです。'},
{id:10,cat:'writing',level:1,type:'writing',passage:'公園の花が咲き始めた。',q:'この文から分かる季節の変化を20字以内で説明しましょう。',limit:20,model:'花が咲く季節になったこと。',rubric:['花が咲き始めた変化に触れている','20字以内である']}
];
const $=id=>document.getElementById(id);let batch=[],index=0,selected=null,checked=false,correctCount=0,strokes=[];
function stats(){const s=JSON.parse(localStorage.getItem('kokugo-progress')||'{"attempts":0,"correct":0}');$('stats').textContent='これまでの選択式正答 '+s.correct+' / '+s.attempts+' 問';}
function start(){const cat=$('category').value,lv=$('level').value;let pool=questions.filter(q=>(cat==='all'||q.cat===cat)&&(lv==='all'||String(q.level)===lv));if(!pool.length){alert('条件に合う問題がありません');return;}batch=pool.sort(()=>Math.random()-.5).slice(0,5);index=0;correctCount=0;$('quiz').classList.remove('hidden');render();}
function render(){const q=batch[index];checked=false;selected=null;$('progress').textContent=(index+1)+' / '+batch.length+' 問・レベル '+q.level;$('question').textContent=q.q;$('passage').textContent=q.passage||'';$('options').replaceChildren();$('writing').classList.toggle('hidden',q.type!=='writing');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('feedback').classList.add('hidden');$('answer').value='';$('count').textContent='';clearInk();if(q.type==='choice')q.choices.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>{selected=i;document.querySelectorAll('.option').forEach((n,j)=>n.classList.toggle('selected',i===j));};$('options').append(b);});}
function check(){if(checked)return;const q=batch[index];if(q.type==='choice'&&selected===null){alert('答えを選んでください');return;}checked=true;const fb=$('feedback');fb.replaceChildren();const p=document.createElement('p');if(q.type==='choice'){const ok=selected===q.correct;p.textContent=(ok?'正解！ ':'もう一度確認しましょう。 ')+q.why;const s=JSON.parse(localStorage.getItem('kokugo-progress')||'{"attempts":0,"correct":0}');s.attempts++;if(ok){s.correct++;correctCount++;}localStorage.setItem('kokugo-progress',JSON.stringify(s));stats();}else{p.textContent='模範解答：'+q.model;const ul=document.createElement('ul');q.rubric.forEach(t=>{const li=document.createElement('li');const label=document.createElement('label');const c=document.createElement('input');c.type='checkbox';label.append(c,document.createTextNode(' '+t));li.append(label);ul.append(li);});fb.append(ul);}fb.prepend(p);fb.classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===batch.length-1?'学習を終了':'次の問題';}
function next(){if(index===batch.length-1){$('quiz').classList.add('hidden');alert('学習終了！ 選択式の正解 '+correctCount+' 問。記述は自己評価で復習しましょう。');}else{index++;render();}}
function clearInk(){const c=$('ink');c.getContext('2d').clearRect(0,0,c.width,c.height);}
const canvas=$('ink'),ctx=canvas.getContext('2d');let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...point(e));ctx.stroke();});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
$('mode').onchange=()=>{const hand=$('mode').value==='handwriting';$('typing').classList.toggle('hidden',hand);$('handwriting').classList.toggle('hidden',!hand);};$('answer').oninput=()=>{const q=batch[index];$('count').textContent=$('answer').value.length+' / '+(q.limit||'—')+' 文字';};$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('clear').onclick=clearInk;stats();
</script></body></html>
