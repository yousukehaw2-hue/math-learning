<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国語まなび</title><style>
:root{font-family:system-ui,sans-serif;color:#26354b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:18px}header{background:#325d85;color:white;padding:18px;border-radius:18px}h1{margin:0;font-size:1.6rem}.panel{background:white;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 2px 9px #0001}button,select,textarea{font:inherit}button{padding:12px 16px;border:0;border-radius:12px;background:#325d85;color:white;cursor:pointer;margin:5px 4px 5px 0}button:disabled{opacity:.45}button.alt{background:#e4edf6;color:#26354b}textarea{width:100%;min-height:110px;border:1px solid #b6c6d5;border-radius:10px;padding:12px}canvas{width:100%;height:240px;border:2px solid #b6c6d5;border-radius:10px;touch-action:none;background:white}label{display:block;margin:8px 0}small{color:#59677b}.hidden{display:none}.option{display:block;width:100%;text-align:left;background:#edf3f8;color:#26354b} .option.selected{outline:3px solid #325d85}@media(min-width:700px){main{padding:30px}}
</style></head><body><main><header><h1>📖 国語まなび</h1><div>中学1年生・読解／漢字／文法／記述</div></header>
<section class="panel"><label>学習分野 <select id="category"><option value="all">すべて</option><option value="reading">読解</option><option value="kanji">漢字・語彙</option><option value="grammar">文法</option><option value="writing">記述</option></select></label><label>学習レベル <select id="level"><option value="all">すべて</option><option value="1">知識理解</option><option value="2">基本</option><option value="3">応用</option></select></label><button id="start">5問の学習を開始</button><p id="stats"></p><p id="reviewStats"></p></section>
<section id="quiz" class="panel hidden"><small id="progress"></small><h2 id="question"></h2><p id="passage"></p><div id="options"></div><div id="writing" class="hidden"><label>入力方法 <select id="mode"><option value="typing">キーボード</option><option value="handwriting">手書き</option></select></label><div id="typing"><textarea id="answer" placeholder="ここに答えを書こう"></textarea><small id="count"></small></div><div id="handwriting" class="hidden"><canvas id="ink" width="800" height="400" aria-label="手書き解答欄"></canvas><button class="alt" id="clear">書き直す</button><small>手書きはこの端末内の画面で確認します。文字認識は未実装です。</small></div></div><button id="check">答えを確認</button><div id="feedback" class="hidden" aria-live="polite"></div><button id="next" class="hidden">次の問題</button></section>
<section class="panel"><h2>学習について</h2><p>東京書籍の学習領域を想定した独自作成の試作問題です。教科書本文は転載していません。正式な単元・学年対応は教材監修後に追加します。</p><p>記述問題は自己評価方式です。自動採点や手書きOCRには対応していません。学習履歴はこの端末のブラウザにのみ保存します。</p></section></main><script>
const questions=[

{"id":19,"cat":"reading","level":3,"type":"choice","passage":"祖父の古い時計は時々遅れる。それでも父は修理して使い続ける。祖父が毎朝ねじを巻いていた姿を覚えているからだ。","q":"父が時計を使い続ける最も大きな理由は？","choices":["祖父との思い出を大切にしている","新しい時計が買えない","時計が正確だから"],"correct":0,"why":"不便さよりも祖父の思い出を大切にする気持ちが描かれています。"},

{"id":21,"cat":"writing","level":2,"type":"writing","passage":"遠足の日、朝から雨が降っていた。しかし、午後には空が明るくなり、予定どおり公園を歩くことができた。","q":"遠足の日の天気の変化を40字以内で説明しましょう。","limit":40,"model":"朝は雨だったが、午後には空が明るくなり公園を歩けた。","rubric":["朝の雨に触れている","午後の変化を説明している","40字以内である"]},
{"id":22,"cat":"writing","level":3,"type":"writing","passage":"学校では紙の配布物が多い。端末で配布すると印刷を減らせる一方、端末を忘れる生徒もいる。","q":"紙と端末の両方の利点・課題を踏まえ、改善案を80字以内で書きましょう。","limit":80,"model":"基本は端末で配布して紙を減らし、端末を忘れた生徒には必要な資料だけ印刷して渡すとよい。","rubric":["印刷削減の利点に触れている","端末を忘れる課題に対応している","具体策を提案している","80字以内である"]},
{"id":23,"cat":"kanji","level":1,"type":"choice","q":"「協力」の読みは？","choices":["きょうりょく","きょうりき","こうりょく"],"correct":0,"why":"協力（きょうりょく）は力を合わせることです。"},
{"id":24,"cat":"kanji","level":2,"type":"choice","q":"「課題」の意味として最も適切なのは？","choices":["取り組むべき問題","すでに終わった仕事","偶然起こった出来事"],"correct":0,"why":"課題は解決や達成に向けて取り組むべき事柄です。"},
{"id":25,"cat":"grammar","level":1,"type":"choice","q":"「大きな犬が走る」の主語は？","choices":["大きな犬が","走る","大きな"],"correct":0,"why":"「何が走るか」を表す「大きな犬が」が主語です。"},
{"id":26,"cat":"grammar","level":2,"type":"choice","q":"「私は読んだ。しかし、内容を忘れた」の「しかし」の働きは？","choices":["逆の内容をつなぐ","理由を示す","例を挙げる"],"correct":0,"why":"「しかし」は前の内容に対して逆接の関係を示します。"},
{"id":27,"cat":"reading","level":2,"type":"choice","passage":"翔太は最初、発表を断ろうとした。友達に練習を手伝ってもらい、当日は自分から手を挙げた。","q":"翔太の変化として適切なのは？","choices":["不安を乗り越え積極的になった","友達とけんかした","発表が嫌いになった"],"correct":0,"why":"断ろうとした状態から、自分から手を挙げる状態に変わっています。"},
{"id":28,"cat":"writing","level":3,"type":"writing","passage":"地域の清掃活動では参加者が減っている。一方、短時間なら参加できるという声が多い。","q":"参加者を増やすための提案を理由とともに80字以内で書きましょう。","limit":80,"model":"清掃活動を30分程度の短い回に分けて実施する。短時間なら参加できる人が多く、参加の負担を減らせるからだ。","rubric":["短時間で参加できる工夫がある","根拠を示している","実行可能な提案である","80字以内である"]}
];
const $=id=>document.getElementById(id);const misconceptionByCat={reading:'本文の根拠・心情',kanji:'漢字の読み・語彙',grammar:'文の成分・接続',writing:'根拠と表現'};function validateBank(){const ids=new Set();for(const q of questions){if(ids.has(q.id)||!['reading','kanji','grammar','writing'].includes(q.cat)||![1,2,3].includes(q.level)||!q.q)throw Error('教材データが不正: '+q.id);ids.add(q.id);if(q.type==='choice'&&(!Array.isArray(q.choices)||q.choices.length<3||q.correct<0||q.correct>=q.choices.length||!q.why))throw Error('選択式問題が不正: '+q.id);if(q.type==='writing'&&(!q.model||!q.limit||!q.rubric?.length))throw Error('記述式問題が不正: '+q.id);}}validateBank();let batch=[],index=0,selected=null,checked=false,correctCount=0,inkUsed=false; const KEY='kokugo-progress-v2'; function load(){try{return JSON.parse(localStorage.getItem(KEY))||{attempts:0,correct:0,writings:[],mistakes:[]}}catch{return {attempts:0,correct:0,writings:[],mistakes:[]}}}function save(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{alert('保存容量またはブラウザ設定により履歴を保存できませんでした')}}
function stats(){const s=load();$('stats').textContent='これまでの選択式正答 '+s.correct+' / '+s.attempts+' 問';const unresolved=[...new Set(s.mistakes||[])].map(id=>questions.find(q=>q.id===id)).filter(Boolean);$('reviewStats').textContent=unresolved.length?'復習が必要：'+unresolved.length+'問（'+[...new Set(unresolved.map(q=>misconceptionByCat[q.cat]))].join('／')+'）':'復習待ちの問題はありません';}
function start(){const cat=$('category').value,lv=$('level').value;let pool=questions.filter(q=>(cat==='all'||q.cat===cat)&&(lv==='all'||String(q.level)===lv));const mistakes=new Set(load().mistakes||[]);pool=pool.map(q=>({q,random:Math.random()})).sort((a,b)=>Number(mistakes.has(b.q.id))-Number(mistakes.has(a.q.id))||a.random-b.random).map(x=>x.q);if(!pool.length){alert('条件に合う問題がありません');return;}batch=pool.slice(0,5);index=0;correctCount=0;$('quiz').classList.remove('hidden');render();}
function render(){const q=batch[index];checked=false;selected=null;$('mode').disabled=false;$('answer').readOnly=false;$('clear').disabled=false;$('mode').value='typing';$('typing').classList.remove('hidden');$('handwriting').classList.add('hidden');$('progress').textContent=(index+1)+' / '+batch.length+' 問・レベル '+q.level;$('question').textContent=q.q;$('passage').textContent=q.passage||'';$('options').replaceChildren();$('writing').classList.toggle('hidden',q.type!=='writing');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=false;$('feedback').classList.add('hidden');$('answer').value='';$('count').textContent='';clearInk();if(q.type==='choice')q.choices.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>{if(checked)return;selected=i;document.querySelectorAll('.option').forEach((n,j)=>n.classList.toggle('selected',i===j));};$('options').append(b);});}
function check(){if(checked)return;const q=batch[index];if(q.type==='writing'){const hand=$('mode').value==='handwriting';const v=$('answer').value.trim();if(hand&&!inkUsed){alert('手書きで答えを書いてください');return;}if(!hand&&!v){alert('答えを入力してください');return;}if(!hand&&Array.from(v).length>q.limit){alert(q.limit+'字以内で入力してください');return;}}if(q.type==='choice'&&selected===null){alert('答えを選んでください');return;}checked=true;const fb=$('feedback');fb.replaceChildren();const p=document.createElement('p');if(q.type==='choice'){const ok=selected===q.correct;p.textContent=(ok?'正解！ ':'もう一度確認しましょう。 ')+q.why+(ok?'':' 復習ポイント：'+misconceptionByCat[q.cat]);const s=load();s.attempts++;if(ok){s.correct++;correctCount++;}if(!ok&&!s.mistakes.includes(q.id))s.mistakes.push(q.id);if(ok)s.mistakes=s.mistakes.filter(id=>id!==q.id);save(s);stats();}else{p.textContent='模範解答：'+q.model;const ul=document.createElement('ul');q.rubric.forEach(t=>{const li=document.createElement('li');const label=document.createElement('label');const c=document.createElement('input');c.type='checkbox';label.append(c,document.createTextNode(' '+t));li.append(label);ul.append(li);});fb.append(ul);const finish=document.createElement('button');finish.textContent='自己評価を保存';finish.onclick=()=>{const checks=[...ul.querySelectorAll('input')].map(c=>c.checked);const record={id:q.id,date:new Date().toISOString(),mode:$('mode').value,answer:$('mode').value==='typing'?$('answer').value:null,image:null,hasHandwriting:$('mode').value==='handwriting',checks};const st=load();st.writings.push(record);st.writings=st.writings.slice(-100);save(st);finish.disabled=true;finish.textContent='保存済み';$('next').disabled=false;};fb.append(finish);if($('mode').value==='handwriting'){const note=document.createElement('p');note.textContent='手書き画像は保存されません。自己評価の結果のみ保存します。';fb.append(note);}$('mode').disabled=true;$('answer').readOnly=true;$('clear').disabled=true;$('next').disabled=true;}fb.prepend(p);fb.classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===batch.length-1?'学習を終了':'次の問題';}
function next(){if($('next').disabled)return;if(index===batch.length-1){$('quiz').classList.add('hidden');alert('学習終了！ 選択式の正解 '+correctCount+' 問。記述は自己評価で復習しましょう。');}else{index++;render();}}
function clearInk(){inkUsed=false;const c=$('ink');c.getContext('2d').clearRect(0,0,c.width,c.height);}
const canvas=$('ink'),ctx=canvas.getContext('2d');let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}
canvas.addEventListener('pointerdown',e=>{drawing=true;inkUsed=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.lineTo(point(e)[0]+0.1,point(e)[1]+0.1);ctx.stroke();});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...point(e));ctx.stroke();});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
$('mode').onchange=()=>{const hand=$('mode').value==='handwriting';$('typing').classList.toggle('hidden',hand);$('handwriting').classList.toggle('hidden',!hand);};$('answer').oninput=()=>{const q=batch[index];$('count').textContent=Array.from($('answer').value).length+' / '+(q.limit||'—')+' 文字';};$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('clear').onclick=clearInk;stats();
</script></body></html>
