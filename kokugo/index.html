const $=id=>document.getElementById(id);const misconceptionByCat={reading:'本文の根拠・心情',kanji:'漢字の読み・語彙',grammar:'文の成分・接続',writing:'根拠と表現'};function validateBank(){const ids=new Set(),prompts=new Set();for(const q of questions){const fingerprint=[q.cat,q.passage||'',q.q].join('|').normalize('NFKC').replace(/\s+/g,'');if(prompts.has(fingerprint))throw Error('重複した設問: '+q.id);prompts.add(fingerprint);if(!topicById[q.id]||!topicById[q.id].startsWith(q.cat+'-')||ids.has(q.id)||!['reading','kanji','grammar','writing'].includes(q.cat)||![1,2,3].includes(q.level)||!q.q)throw Error('教材データが不正: '+q.id);ids.add(q.id);if(q.type==='choice'&&(!Array.isArray(q.choices)||q.choices.length<3||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.choices.length||!q.why?.trim()||q.choices.some(x=>typeof x!=='string'||!x.trim())||new Set(q.choices.map(x=>x.normalize('NFKC').trim())).size!==q.choices.length))throw Error('選択式問題が不正: '+q.id);if(q.type==='writing'&&(!q.model?.trim()||!Number.isInteger(q.limit)||q.limit<1||Array.from(q.model).length>q.limit||!q.rubric?.length||q.rubric.some(x=>typeof x!=='string'||!x.trim())))throw Error('記述式問題が不正: '+q.id);}}validateBank();let batch=[],index=0,selected=null,checked=false,correctCount=0,inkUsed=false; const KEY='kokugo-progress-v2'; function load(){try{return JSON.parse(localStorage.getItem(KEY))||{attempts:0,correct:0,writings:[],mistakes:[]}}catch{return {attempts:0,correct:0,writings:[],mistakes:[]}}}function save(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{alert('保存容量またはブラウザ設定により履歴を保存できませんでした')}}
function stats(){const s=load();$('stats').textContent='これまでの選択式正答 '+s.correct+' / '+s.attempts+' 問';const unresolved=[...new Set(s.mistakes||[])].map(id=>questions.find(q=>q.id===id)).filter(Boolean);$('reviewStats').textContent=unresolved.length?'復習が必要：'+unresolved.length+'問（'+[...new Set(unresolved.map(q=>misconceptionByCat[q.cat]))].join('／')+'）' :'復習待ちの問題はありません';const byCat={reading:{a:0,c:0},kanji:{a:0,c:0},grammar:{a:0,c:0},writing:{a:0,c:0}};for(const a of (s.choiceHistory||[])){if(byCat[a.cat]){byCat[a.cat].a++;if(a.ok)byCat[a.cat].c++;}}const lines=Object.entries(byCat).filter(([k,v])=>v.a).map(([k,v])=>({cat:k,text:misconceptionByCat[k]+'：'+v.c+'/'+v.a+'問（'+Math.round(v.c/v.a*100)+'%）'}));const d=$('dashboard');d.replaceChildren();for(const x of lines){const p=document.createElement('p');p.textContent=x.text;d.append(p);}const p=document.createElement('p');p.textContent='記述の自己評価記録：'+(s.writings||[]).length+'件。履歴はこの端末内に保存されます。';d.append(p);}
const topicById={"1":"reading-evidence","2":"reading-feeling","3":"kanji-reading","4":"grammar-parts","5":"writing-explain","6":"reading-feeling","7":"writing-propose","8":"grammar-parts","9":"kanji-meaning","10":"writing-explain","11":"kanji-reading","12":"kanji-meaning","13":"kanji-meaning","14":"grammar-parts","15":"grammar-parts","16":"grammar-connect","17":"reading-evidence","18":"reading-feeling","19":"reading-feeling","20":"writing-explain","21":"writing-explain","22":"writing-propose","23":"kanji-reading","24":"kanji-meaning","25":"grammar-parts","26":"grammar-connect","27":"reading-evidence","28":"writing-propose","29":"reading-evidence","30":"reading-evidence","31":"reading-feeling","32":"reading-evidence","33":"reading-evidence","34":"reading-evidence","35":"reading-feeling","36":"reading-evidence","37":"reading-evidence","38":"reading-evidence","39":"reading-feeling","40":"reading-evidence","41":"kanji-reading","42":"kanji-reading","43":"kanji-reading","44":"kanji-reading","45":"kanji-reading","46":"kanji-reading","47":"kanji-reading","48":"kanji-reading","49":"kanji-reading","50":"kanji-reading","51":"kanji-reading","52":"kanji-reading","53":"kanji-reading","54":"kanji-reading","55":"kanji-reading","56":"kanji-reading","57":"kanji-reading","58":"kanji-reading","59":"grammar-parts","60":"grammar-parts","61":"grammar-connect","62":"grammar-parts","63":"grammar-parts","64":"grammar-connect","65":"grammar-parts","66":"grammar-connect","67":"grammar-parts","68":"grammar-connect","69":"grammar-parts","70":"grammar-parts","71":"grammar-parts","72":"grammar-connect","73":"grammar-parts","74":"grammar-connect","75":"grammar-parts","76":"grammar-connect","77":"writing-propose","78":"writing-propose","79":"writing-propose","80":"writing-propose","81":"writing-propose","82":"writing-propose","83":"writing-propose","84":"writing-propose","85":"writing-propose","86":"writing-propose","87":"writing-propose","88":"writing-propose","89":"writing-propose","90":"writing-propose","91":"writing-propose","92":"writing-propose","93":"writing-propose","94":"writing-propose","95":"writing-propose","96":"writing-propose","97":"writing-propose","98":"writing-propose","99":"writing-propose","100":"writing-propose"};function topicOf(q){return topicById[q.id];}function updateBankStats(){const cat=$('category').value,lv=$('level').value;const focus=$('examFocus').value,topic=$('topic').value;const n=questions.filter(q=>(cat==='all'||q.cat===cat)&&(focus==='all'||q.cat===focus)&&(topic==='all'||topicOf(q)===topic)&&(lv==='all'||String(q.level)===lv)).length;$('bankStats').textContent='収録 '+questions.length+' 問 ／ この条件で '+n+' 問 ／ 今回 '+Math.min(n,Number($('batchSize').value))+' 問';}const difficultyNames={1:'基礎：知識・事実確認',2:'標準：根拠を使った理解',3:'応用：複数情報の整理・説明'};const reviewByTopic={'reading-evidence':'本文の問いに関係する一文を探し、選択肢と照合しよう。','reading-feeling':'人物の行動や前後の変化を探し、気持ちを裏付ける表現を確認しよう。','kanji-reading':'漢字を一字ずつ読み、熟語全体の意味と一緒に声に出そう。','kanji-meaning':'前後の文脈に当てはめて、語の意味が自然か確かめよう。','grammar-parts':'どの語がどの語を詳しくしているか、主語・述語との関係を確認しよう。','grammar-connect':'接続する前後の内容を分け、理由・逆接・並列のどれかを考えよう。','writing-explain':'本文から必要な事実を抜き出し、指定字数内で説明しよう。','writing-propose':'問題点・提案・理由を一つずつ確認し、筋道を立てよう。'};const prerequisiteByTopic={'reading-evidence':1,'reading-feeling':2,'kanji-reading':3,'kanji-meaning':9,'grammar-parts':8,'grammar-connect':26,'writing-explain':20,'writing-propose':77};function prerequisiteFor(q){const id=prerequisiteByTopic[topicOf(q)];return id===q.id?null:questions.find(x=>x.id===id)||null;}function reviewRoute(q){const p=prerequisiteFor(q);return p?' 前提確認：問題'+p.id+'「'+p.q+'」に戻ってから再挑戦しよう。':' まずこの問題の解説を読み、同じテーマの問題で確認しよう。';}function wrongChoiceHint(q,choiceIndex){if(q.type!=='choice')return '';const selectedText=q.choices[choiceIndex];return '選んだ「'+selectedText+'」と正答「'+q.choices[q.correct]+'」を比較し、本文・語句・文法のどこが異なるか確認しよう。';}function reviewHint(q){return reviewByTopic[topicOf(q)]||studyHint(q);}function studyHint(q){if(q.cat==='reading')return '本文のどの言葉が根拠になるか、線を引くつもりで探そう。';if(q.cat==='kanji')return '漢字の意味や熟語の使い方を確認し、声に出して読み直そう。';if(q.cat==='grammar')return '主語・述語・修飾語の役割を短い文で確かめよう。';return '結論・根拠・理由がそろっているかを確認しよう。';}function start(){const cat=$('category').value,lv=$('level').value,focus=$('examFocus').value,topic=$('topic').value;let pool=questions.filter(q=>(cat==='all'||q.cat===cat)&&(focus==='all'||q.cat===focus)&&(topic==='all'||topicOf(q)===topic)&&(lv==='all'||String(q.level)===lv));const mistakes=new Set(load().mistakes||[]);const history=load().choiceHistory||[];const accuracy={};for(const a of history){const v=accuracy[a.cat]||(accuracy[a.cat]={a:0,c:0});v.a++;if(a.ok)v.c++;}pool=pool.map(q=>({q,random:Math.random(),weak:accuracy[q.cat]&&accuracy[q.cat].a>=3?1-accuracy[q.cat].c/accuracy[q.cat].a:0})).sort((a,b)=>Number(mistakes.has(b.q.id))-Number(mistakes.has(a.q.id))||b.weak-a.weak||a.random-b.random).map(x=>x.q);if(!pool.length){alert('条件に合う問題がありません');return;}batch=pool.slice(0,Number($('batchSize').value));index=0;correctCount=0;$('quiz').classList.remove('hidden');render();}
function shuffleChoices(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function render(){const q=batch[index];checked=false;selected=null;$('mode').disabled=false;$('answer').readOnly=false;$('clear').disabled=false;$('mode').value='typing';$('typing').classList.remove('hidden');$('handwriting').classList.add('hidden');$('progress').textContent=(index+1)+' / '+batch.length+' 問・'+difficultyNames[q.level];$('question').textContent=q.q;$('passage').textContent=q.passage||'';$('options').replaceChildren();$('writing').classList.toggle('hidden',q.type!=='writing');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=false;$('feedback').classList.add('hidden');$('answer').value='';$('count').textContent='';clearInk();if(q.type==='choice')shuffleChoices(q.choices.map((v,i)=>({v,i}))).forEach(({v,i})=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>{if(checked)return;selected=i;document.querySelectorAll('.option').forEach((n,j)=>n.classList.toggle('selected',n===b));};$('options').append(b);});}
function check(){if(checked)return;const q=batch[index];if(q.type==='writing'){const hand=$('mode').value==='handwriting';const v=$('answer').value.trim();if(hand&&!inkUsed){alert('手書きで答えを書いてください');return;}if(!hand&&!v){alert('答えを入力してください');return;}if(!hand&&Array.from(v).length>q.limit){alert(q.limit+'字以内で入力してください');return;}}if(q.type==='choice'&&selected===null){alert('答えを選んでください');return;}checked=true;const fb=$('feedback');fb.replaceChildren();const p=document.createElement('p');if(q.type==='choice'){const ok=selected===q.correct;p.textContent=(ok?'正解！ ':'もう一度確認しましょう。 ')+q.why+(ok?'':' 復習ポイント：'+misconceptionByCat[q.cat]);if(!ok){const hint=document.createElement('p');hint.textContent='復習のヒント：'+reviewHint(q)+' '+wrongChoiceHint(q,selected)+reviewRoute(q);fb.append(hint);const prerequisite=prerequisiteFor(q);if(prerequisite){const go=document.createElement('button');go.className='alt';go.textContent='前提問題 '+prerequisite.id+' を解いて復習';go.onclick=()=>{batch=[prerequisite,q];index=0;correctCount=0;render();};fb.append(go);}}const s=load();s.attempts++;s.choiceHistory=s.choiceHistory||[];s.choiceHistory.push({id:q.id,cat:q.cat,ok,date:new Date().toISOString()});s.choiceHistory=s.choiceHistory.slice(-500);if(ok){s.correct++;correctCount++;}if(!ok&&!s.mistakes.includes(q.id))s.mistakes.push(q.id);if(ok)s.mistakes=s.mistakes.filter(id=>id!==q.id);save(s);stats();}else{p.textContent='模範解答：'+q.model;const guidance=document.createElement('p');guidance.textContent='模範解答と自分の解答を比べ、次の観点を確認してから保存しましょう。';fb.append(guidance);const hint=document.createElement('p');hint.textContent='書く前に確認：'+reviewHint(q);fb.append(hint);const ul=document.createElement('ul');q.rubric.forEach(t=>{const li=document.createElement('li');const label=document.createElement('label');const c=document.createElement('input');c.type='checkbox';label.append(c,document.createTextNode(' '+t));li.append(label);ul.append(li);});fb.append(ul);const finish=document.createElement('button');finish.textContent='自己評価を保存';finish.onclick=()=>{const checks=[...ul.querySelectorAll('input')].map(c=>c.checked);const record={id:q.id,date:new Date().toISOString(),mode:$('mode').value,answer:$('mode').value==='typing'?$('answer').value:null,image:null,hasHandwriting:$('mode').value==='handwriting',checks};const st=load();st.writings.push(record);st.writings=st.writings.slice(-100);save(st);finish.disabled=true;finish.textContent='保存済み（'+checks.filter(Boolean).length+' / '+checks.length+'観点）';const retry=document.createElement('button');retry.className='alt';retry.textContent='もう一度書く';retry.onclick=()=>{checked=false;$('mode').disabled=false;$('answer').readOnly=false;$('clear').disabled=false;fb.classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=false;};fb.append(retry);$('next').disabled=false;};fb.append(finish);if($('mode').value==='handwriting'){const note=document.createElement('p');note.textContent='手書き画像は保存されません。自己評価の結果のみ保存します。';fb.append(note);}$('mode').disabled=true;$('answer').readOnly=true;$('clear').disabled=true;$('next').disabled=true;}fb.prepend(p);fb.classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===batch.length-1?'学習を終了':'次の問題';}
function next(){if($('next').disabled)return;if(index===batch.length-1){$('quiz').classList.add('hidden');alert('学習終了！ 選択式の正解 '+correctCount+' 問。記述は自己評価で復習しましょう。');}else{index++;render();}}
function clearInk(){inkUsed=false;const c=$('ink');c.getContext('2d').clearRect(0,0,c.width,c.height);}
const canvas=$('ink'),ctx=canvas.getContext('2d');let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}
canvas.addEventListener('pointerdown',e=>{drawing=true;inkUsed=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.lineTo(point(e)[0]+0.1,point(e)[1]+0.1);ctx.stroke();});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...point(e));ctx.stroke();});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
$('mode').onchange=()=>{const hand=$('mode').value==='handwriting';$('typing').classList.toggle('hidden',hand);$('handwriting').classList.toggle('hidden',!hand);};$('answer').oninput=()=>{const q=batch[index];$('count').textContent=Array.from($('answer').value).length+' / '+(q.limit||'—')+' 文字';};$('category').onchange=updateBankStats;$('level').onchange=updateBankStats;$('batchSize').onchange=updateBankStats;$('examFocus').onchange=updateBankStats;$('topic').onchange=updateBankStats;$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('clear').onclick=clearInk;stats();updateBankStats();
</script></body></html>
