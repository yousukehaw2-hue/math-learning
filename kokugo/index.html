const $=id=>document.getElementById(id);const misconceptionByCat={reading:'本文の根拠・心情',kanji:'漢字の読み・語彙',grammar:'文の成分・接続',writing:'根拠と表現'};function validateBank(){const ids=new Set();for(const q of questions){if(ids.has(q.id)||!['reading','kanji','grammar','writing'].includes(q.cat)||![1,2,3].includes(q.level)||!q.q)throw Error('教材データが不正: '+q.id);ids.add(q.id);if(q.type==='choice'&&(!Array.isArray(q.choices)||q.choices.length<3||q.correct<0||q.correct>=q.choices.length||!q.why||new Set(q.choices).size!==q.choices.length))throw Error('選択式問題が不正: '+q.id);if(q.type==='writing'&&(!q.model||!q.limit||!q.rubric?.length||q.rubric.some(x=>typeof x!=='string'||!x.trim())))throw Error('記述式問題が不正: '+q.id);}}validateBank();let batch=[],index=0,selected=null,checked=false,correctCount=0,inkUsed=false; const KEY='kokugo-progress-v2'; function load(){try{return JSON.parse(localStorage.getItem(KEY))||{attempts:0,correct:0,writings:[],mistakes:[]}}catch{return {attempts:0,correct:0,writings:[],mistakes:[]}}}function save(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{alert('保存容量またはブラウザ設定により履歴を保存できませんでした')}}
function stats(){const s=load();$('stats').textContent='これまでの選択式正答 '+s.correct+' / '+s.attempts+' 問';const unresolved=[...new Set(s.mistakes||[])].map(id=>questions.find(q=>q.id===id)).filter(Boolean);$('reviewStats').textContent=unresolved.length?'復習が必要：'+unresolved.length+'問（'+[...new Set(unresolved.map(q=>misconceptionByCat[q.cat]))].join('／')+'）':'復習待ちの問題はありません';}
function updateBankStats(){const cat=$('category').value,lv=$('level').value;const n=questions.filter(q=>(cat==='all'||q.cat===cat)&&(lv==='all'||String(q.level)===lv)).length;$('bankStats').textContent='収録 '+questions.length+' 問 ／ この条件で '+n+' 問 ／ 今回 '+Math.min(n,Number($('batchSize').value))+' 問';}function start(){const cat=$('category').value,lv=$('level').value;let pool=questions.filter(q=>(cat==='all'||q.cat===cat)&&(lv==='all'||String(q.level)===lv));const mistakes=new Set(load().mistakes||[]);pool=pool.map(q=>({q,random:Math.random()})).sort((a,b)=>Number(mistakes.has(b.q.id))-Number(mistakes.has(a.q.id))||a.random-b.random).map(x=>x.q);if(!pool.length){alert('条件に合う問題がありません');return;}batch=pool.slice(0,Number($('batchSize').value));index=0;correctCount=0;$('quiz').classList.remove('hidden');render();}
function shuffleChoices(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function render(){const q=batch[index];checked=false;selected=null;$('mode').disabled=false;$('answer').readOnly=false;$('clear').disabled=false;$('mode').value='typing';$('typing').classList.remove('hidden');$('handwriting').classList.add('hidden');$('progress').textContent=(index+1)+' / '+batch.length+' 問・レベル '+q.level;$('question').textContent=q.q;$('passage').textContent=q.passage||'';$('options').replaceChildren();$('writing').classList.toggle('hidden',q.type!=='writing');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=false;$('feedback').classList.add('hidden');$('answer').value='';$('count').textContent='';clearInk();if(q.type==='choice')shuffleChoices(q.choices.map((v,i)=>({v,i}))).forEach(({v,i})=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>{if(checked)return;selected=i;document.querySelectorAll('.option').forEach((n,j)=>n.classList.toggle('selected',n===b));};$('options').append(b);});}
function check(){if(checked)return;const q=batch[index];if(q.type==='writing'){const hand=$('mode').value==='handwriting';const v=$('answer').value.trim();if(hand&&!inkUsed){alert('手書きで答えを書いてください');return;}if(!hand&&!v){alert('答えを入力してください');return;}if(!hand&&Array.from(v).length>q.limit){alert(q.limit+'字以内で入力してください');return;}}if(q.type==='choice'&&selected===null){alert('答えを選んでください');return;}checked=true;const fb=$('feedback');fb.replaceChildren();const p=document.createElement('p');if(q.type==='choice'){const ok=selected===q.correct;p.textContent=(ok?'正解！ ':'もう一度確認しましょう。 ')+q.why+(ok?'':' 復習ポイント：'+misconceptionByCat[q.cat]);const s=load();s.attempts++;if(ok){s.correct++;correctCount++;}if(!ok&&!s.mistakes.includes(q.id))s.mistakes.push(q.id);if(ok)s.mistakes=s.mistakes.filter(id=>id!==q.id);save(s);stats();}else{p.textContent='模範解答：'+q.model;const guidance=document.createElement('p');guidance.textContent='模範解答と自分の解答を比べ、次の観点を確認してから保存しましょう。';fb.append(guidance);const ul=document.createElement('ul');q.rubric.forEach(t=>{const li=document.createElement('li');const label=document.createElement('label');const c=document.createElement('input');c.type='checkbox';label.append(c,document.createTextNode(' '+t));li.append(label);ul.append(li);});fb.append(ul);const finish=document.createElement('button');finish.textContent='自己評価を保存';finish.onclick=()=>{const checks=[...ul.querySelectorAll('input')].map(c=>c.checked);const record={id:q.id,date:new Date().toISOString(),mode:$('mode').value,answer:$('mode').value==='typing'?$('answer').value:null,image:null,hasHandwriting:$('mode').value==='handwriting',checks};const st=load();st.writings.push(record);st.writings=st.writings.slice(-100);save(st);finish.disabled=true;finish.textContent='保存済み';const retry=document.createElement('button');retry.className='alt';retry.textContent='もう一度書く';retry.onclick=()=>{checked=false;$('mode').disabled=false;$('answer').readOnly=false;$('clear').disabled=false;fb.classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=false;};fb.append(retry);$('next').disabled=false;};fb.append(finish);if($('mode').value==='handwriting'){const note=document.createElement('p');note.textContent='手書き画像は保存されません。自己評価の結果のみ保存します。';fb.append(note);}$('mode').disabled=true;$('answer').readOnly=true;$('clear').disabled=true;$('next').disabled=true;}fb.prepend(p);fb.classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===batch.length-1?'学習を終了':'次の問題';}
function next(){if($('next').disabled)return;if(index===batch.length-1){$('quiz').classList.add('hidden');alert('学習終了！ 選択式の正解 '+correctCount+' 問。記述は自己評価で復習しましょう。');}else{index++;render();}}
function clearInk(){inkUsed=false;const c=$('ink');c.getContext('2d').clearRect(0,0,c.width,c.height);}
const canvas=$('ink'),ctx=canvas.getContext('2d');let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}
canvas.addEventListener('pointerdown',e=>{drawing=true;inkUsed=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.lineTo(point(e)[0]+0.1,point(e)[1]+0.1);ctx.stroke();});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...point(e));ctx.stroke();});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
$('mode').onchange=()=>{const hand=$('mode').value==='handwriting';$('typing').classList.toggle('hidden',hand);$('handwriting').classList.toggle('hidden',!hand);};$('answer').oninput=()=>{const q=batch[index];$('count').textContent=Array.from($('answer').value).length+' / '+(q.limit||'—')+' 文字';};$('category').onchange=updateBankStats;$('level').onchange=updateBankStats;$('batchSize').onchange=updateBankStats;$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('clear').onclick=clearInk;stats();updateBankStats();
</script></body></html>
